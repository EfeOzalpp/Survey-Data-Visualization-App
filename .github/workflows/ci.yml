name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint cleaned modules
        run: npm run lint:ci

      - name: Test
        run: npm test -- --no-coverage

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build:all
        env:
          VITE_USE_MOCK_DATA: "true"

  build-image:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ghcr.io/efeozalpp/butterfly-effect:latest
            ghcr.io/efeozalpp/butterfly-effect:${{ github.sha }}

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" | tr -d '\r' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes "${EC2_USER}@${EC2_HOST}" '
            set -e
            cd ~/butterfly-effect && git fetch origin main && git reset --hard origin/main && cd app
            docker compose pull postgres migrate app
            docker compose up -d --remove-orphans postgres migrate app
            sleep 5
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null
          '
          rm -f /tmp/deploy_key
